[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poststudio"
version = "0.4.1"
description = "Local image sampling and composition workbench"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "numpy>=2,<3", "tifffile>=2025.1", "imagecodecs>=2025.1", "Pillow>=11"]

[project.scripts]
poststudio = "blockstudio.app:main"
blockstudio = "blockstudio.app:main"

[tool.setuptools.packages.find]
include = ["blockstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
